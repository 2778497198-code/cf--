<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星萌社——导航页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f0f4ff;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #4285F4;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .btn-primary {
            display: block;
            background: #4285F4;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 16px;
        }
        .domain-tip {
            background: #e8f0fe;
            border-left: 4px solid #4285F4;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .warning-tip {
            background: #fff9e6;
            border-left: 4px solid #ffb800;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
        }
        .warning-tip h3 {
            margin-bottom: 8px;
            color: #d97706;
        }
        .browser-links a {
            color: #4285F4;
            text-decoration: none;
            margin-right: 8px;
        }
        .browser-links a:hover {
            text-decoration: underline;
        }
        .link-card {
            background: #f8fafc;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .link-card small {
            color: #64748b;
        }
        .link-card a {
            color: #4285F4;
            text-decoration: none;
            display: inline-block;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>星萌社——导航页</h1>

        <a href="#" class="btn-primary">Ctrl+D 收藏本页到浏览器收藏夹</a>

        <div class="domain-tip">
            最新域名：slgbox.top【建议使用谷歌浏览器或者挂梯子】
        </div>

        <div class="warning-tip">
            <h3>⚠️【重要】勿使用国产浏览器访问</h3>
            <p>可能会出现误报和拦截等奇怪操作</p>
            <p style="margin: 8px 0;">✅ 建议使用以下浏览器：</p>
            <div class="browser-links">
                <a href="#">Chrome官网</a> |
                <a href="#">Edge官网</a> |
                <a href="#">Firefox官网</a> |
                <a href="#">X浏览器官网</a> |
                <a href="#">Via官网</a> |
                <a href="#">Alook官网</a>
            </div>
        </div>

        <div class="link-card">
            <small>492ms</small>
            <h3>主站地址</h3>
            <a href="#">访问主站</a>
            <p style="color: #64748b; margin-top: 4px;">无法访问</p>
        </div>

        <div class="link-card">
            <small>493ms</small>
            <h3>下载列表</h3>
            <a href="#">点击前往</a>
            <p style="color: #64748b; margin-top: 4px;">无法访问</p>
        </div>

        <p style="margin-top: 16px; color: #64748b; font-size: 14px;">ℹ️ 星萌资源库(部分地区需要挂梯子)</p>
    </div>
</body>
</html>
